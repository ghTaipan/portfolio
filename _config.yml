title: "Taipan's Blog"

url: "https://ghtaipan.github.io"
baseurl: "/portfolio"

remote_theme: mmistakes/minimal-mistakes

plugins:
  - jekyll-include-cache

minimal_mistakes_skin: "dark"
show_downloads: false

author:
  name: "Berke Aktaş"
  bio: "Gameplay Programmer & Gamer"
  avatar: "/assets/images/avatar.png"
  links:
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/ghTaipan"
    - label: "LinkedIn"
      icon: "fab fa-linkedin"
      url: "https://linkedin.com/in/berke-aktas-04b9071bb"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      classes: wide
